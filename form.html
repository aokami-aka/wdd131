<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Product review form">
  <title>Product Review</title>
  <link rel="stylesheet" href="styles/form.css">
  <script src="scripts/form.js" defer></script>
</head>
<body>
  <header>
    <h1>Product Review</h1>
  </header>

  <main>
    <form method="get" action="review.html">
      <div class="form-group">
        <label for="productName">Product Name</label>
        <select id="productName" name="productName" required>
          <option value="" disabled selected>Select a Product ...</option>
        </select>
      </div>

      <fieldset class="form-group rating-group">
        <legend>Overall Rating</legend>
        <div class="rating-options">
          <div class="rating-option">
            <input type="radio" id="rating1" name="rating" value="1" required>
            <label for="rating1" aria-label="1 star">
              <span class="star">★</span>
            </label>
          </div>

          <div class="rating-option">
            <input type="radio" id="rating2" name="rating" value="2">
            <label for="rating2" aria-label="2 stars">
              <span class="star">★</span>
              <span class="star">★</span>
            </label>
          </div>

          <div class="rating-option">
            <input type="radio" id="rating3" name="rating" value="3">
            <label for="rating3" aria-label="3 stars">
              <span class="star">★</span>
              <span class="star">★</span>
              <span class="star">★</span>
            </label>
          </div>

          <div class="rating-option">
            <input type="radio" id="rating4" name="rating" value="4">
            <label for="rating4" aria-label="4 stars">
              <span class="star">★</span>
              <span class="star">★</span>
              <span class="star">★</span>
              <span class="star">★</span>
            </label>
          </div>

          <div class="rating-option">
            <input type="radio" id="rating5" name="rating" value="5">
            <label for="rating5" aria-label="5 stars">
              <span class="star">★</span>
              <span class="star">★</span>
              <span class="star">★</span>
              <span class="star">★</span>
              <span class="star">★</span>
            </label>
          </div>
        </div>
      </fieldset>

      <div class="form-group">
        <label for="installDate">Date of Installation</label>
        <input type="date" id="installDate" name="installDate" required>
      </div>

      <fieldset class="form-group">
        <legend>
          Which features did you find useful in the product?
          <span class="hint">(Check all that apply)</span>
        </legend>

        <div class="checkbox-group">
          <label for="durability">
            <input type="checkbox" id="durability" name="features" value="Durability">
            <span>Durability</span>
          </label>

          <label for="easeOfUse">
            <input type="checkbox" id="easeOfUse" name="features" value="Ease of Use">
            <span>Ease of Use</span>
          </label>

          <label for="performance">
            <input type="checkbox" id="performance" name="features" value="Performance">
            <span>Performance</span>
          </label>

          <label for="design">
            <input type="checkbox" id="design" name="features" value="Design">
            <span>Design</span>
          </label>
        </div>
      </fieldset>

      <div class="form-group">
        <label for="writtenReview">
          Written Review <span class="optional">(Optional)</span>
        </label>
        <textarea id="writtenReview" name="writtenReview" rows="7"></textarea>
      </div>

      <div class="form-group">
        <label for="userName">
          Your Name <span class="optional">(Optional)</span>
        </label>
        <input type="text" id="userName" name="userName" autocomplete="name">
      </div>

      <input type="submit" value="Post Review">
    </form>
  </main>

  <footer>
    <p>&copy; <span id="currentYear"></span> Victor Santos | Paraíba, Brazil</p>
    <p>Product Review Form</p>
  </footer>
</body>
</html>
